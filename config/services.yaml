# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # OpenAPI factory to add authentication endpoints to documentation
    App\OpenApi\OpenApiFactory:
        decorates: 'api_platform.openapi.factory'
        arguments: ['@.inner']

    # Entity lifecycle event subscriber
    App\EventSubscriber\EntityLifecycleSubscriber:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
        tags:
            - { name: doctrine.event_subscriber }
    
    # Article slug URI variable transformer
    App\State\ArticleSlugUriVariableTransformer:
        tags:
            - { name: 'api_platform.uri_variable_transformer' }

    App\ApiPlatform\Extension\ArticleExtension:
        arguments:
            $security: '@security.helper'
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection }
            - { name: api_platform.doctrine.orm.query_extension.item }
    
    App\Filter\BinaryUuidFilter:
        tags:
            - { name: 'api_platform.filter', id: 'App\Filter\BinaryUuidFilter' }

    # JWT Preprocessor for graceful expired token handling on GET requests
    App\EventListener\JWTPreprocessor:
        arguments:
            $jwtEncoder: '@lexik_jwt_authentication.encoder'
            $logger: '@logger'
        tags:
            - { name: kernel.event_subscriber }
            - { name: monolog.logger, channel: security }

    # User processor for password hashing and role defaults
    App\State\UserProcessor:
        arguments:
            $decoratedProcessor: '@api_platform.doctrine.orm.state.persist_processor'
    
    # User change password processor for secure password changes
    App\State\UserChangePasswordProcessor:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $passwordHasher: '@security.user_password_hasher'
            $security: '@security.helper'
            $requestStack: '@request_stack'

